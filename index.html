function applyTxBalance(tx, sign = 1) {
  const amt = (Number(tx.amount) || 0) * sign;
  if (!amt) return;

  if (tx.type === "Transfer" || tx.type === "Withdrawal") {
    if (tx.accountId && state.accounts) {
      const source = state.accounts.find(a => a.id === tx.accountId);
      if (source) { source.balance = (Number(source.balance) || 0) - amt; source.updatedAt = Date.now(); }
    }
    if (tx.targetAccountId && state.accounts) {
      const target = state.accounts.find(a => a.id === tx.targetAccountId);
      if (target) { target.balance = (Number(target.balance) || 0) + amt; target.updatedAt = Date.now(); }
    }
    return;
  }

  if (tx.type === "CC Payment") {
    if (tx.creditCardId && state.creditCards) {
      const card = state.creditCards.find(c => c.id === tx.creditCardId);
      if (card) { card.balance = Math.max(0, (Number(card.balance) || 0) - amt); card.updatedAt = Date.now(); }
    }
    if (tx.accountId && state.accounts) {
      const acct = state.accounts.find(a => a.id === tx.accountId);
      if (acct) { acct.balance = (Number(acct.balance) || 0) - amt; acct.updatedAt = Date.now(); }
    }
    return;
  }
  
  if (tx.type === "Debt Payment") {
    if (tx.debtId && state.debts) {
      const debt = state.debts.find(d => d.id === tx.debtId);
      if (debt) { debt.current = Math.max(0, (Number(debt.current) || 0) - amt); debt.updatedAt = Date.now(); }
    }
    if (tx.accountId && state.accounts) {
      const acct = state.accounts.find(a => a.id === tx.accountId);
      if (acct) { acct.balance = (Number(acct.balance) || 0) - amt; acct.updatedAt = Date.now(); }
    }
    return;
  }

  if (tx.paymentType === "Credit" || tx.creditCardId) {
    const targetId = tx.accountId || tx.creditCardId;
    if (targetId && state.creditCards) {
      const card = state.creditCards.find(c => c.id === targetId);
      if (card) {
        if (tx.type === "Expense") card.balance = (Number(card.balance) || 0) + amt;
        else if (tx.type === "Income") card.balance = Math.max(0, (Number(card.balance) || 0) - amt);
        card.updatedAt = Date.now();
      }
    }
  } else {
    const targetId = tx.accountId;
    if (targetId && state.accounts) {
      const acct = state.accounts.find(a => a.id === targetId);
      if (acct) {
        if (tx.type === "Expense") acct.balance = (Number(acct.balance) || 0) - amt;
        else if (tx.type === "Income") acct.balance = (Number(acct.balance) || 0) + amt;
        acct.updatedAt = Date.now();
      }
    }
  }
}

function addTransaction(){
  const date = document.getElementById("tx-date").value || todayStr();
  const description = document.getElementById("tx-desc").value || "Untitled";
  const type = document.getElementById("tx-type").value;
  const category = document.getElementById("tx-cat").value;
  const amount = parseFloat(document.getElementById("tx-amt").value) || 0;
  
  let paymentType = "Debit";
  let accountId = "";
  let accountName = "";
  let creditCardId = "";
  let creditCardName = "";
  let debtId = "";
  let debtName = "";
  let targetAccountId = "";
  let targetAccountName = "";

  if (type === "CC Payment") {
    paymentType = "Debit";
    accountId = document.getElementById("tx-from-acct") ? document.getElementById("tx-from-acct").value : "";
    creditCardId = document.getElementById("tx-to-cc") ? document.getElementById("tx-to-cc").value : "";
    
    if (accountId && state.accounts) {
      const a = state.accounts.find(x => x.id === accountId);
      if (a) { accountName = a.name; paymentType = a.type; }
    }
    if (creditCardId && state.creditCards) {
      const c = state.creditCards.find(x => x.id === creditCardId);
      if (c) creditCardName = c.name;
    }
  } else if (type === "Debt Payment") {
    paymentType = "Debit";
    accountId = document.getElementById("tx-from-acct") ? document.getElementById("tx-from-acct").value : "";
    debtId = document.getElementById("tx-to-debt") ? document.getElementById("tx-to-debt").value : "";
    
    if (accountId && state.accounts) {
      const a = state.accounts.find(x => x.id === accountId);
      if (a) { accountName = a.name; paymentType = a.type; }
    }
    if (debtId && state.debts) {
      const d = state.debts.find(x => x.id === debtId);
      if (d) debtName = d.name;
    }
  } else if (type === "Transfer") {
    paymentType = "Debit";
    accountId = document.getElementById("tx-from-acct") ? document.getElementById("tx-from-acct").value : "";
    targetAccountId = document.getElementById("tx-to-acct") ? document.getElementById("tx-to-acct").value : "";
    
    if (accountId && state.accounts) {
      const a = state.accounts.find(x => x.id === accountId);
      if (a) { accountName = a.name; paymentType = a.type; }
    }
    if (targetAccountId && state.accounts) {
      const a = state.accounts.find(x => x.id === targetAccountId);
      if (a) targetAccountName = a.name;
    }
  } else if (type === "Withdrawal") {
    paymentType = "Debit";
    accountId = document.getElementById("tx-from-acct") ? document.getElementById("tx-from-acct").value : "";
    targetAccountId = document.getElementById("tx-to-cash") ? document.getElementById("tx-to-cash").value : "";
    
    if (accountId && state.accounts) {
      const a = state.accounts.find(x => x.id === accountId);
      if (a) { accountName = a.name; paymentType = a.type; }
    }
    if (targetAccountId && state.accounts) {
      const a = state.accounts.find(x => x.id === targetAccountId);
      if (a) targetAccountName = a.name;
    }
  } else {
    paymentType = document.getElementById("tx-acct-type") ? document.getElementById("tx-acct-type").value : "Debit";
    accountId = document.getElementById("tx-acct-id") ? document.getElementById("tx-acct-id").value : "";
    
    if (paymentType === "Credit") {
      creditCardId = accountId;
      if (creditCardId && state.creditCards) {
        const c = state.creditCards.find(x => x.id === creditCardId);
        if (c) { creditCardName = c.name; accountName = c.name; }
      }
    } else {
      if (accountId && state.accounts) {
        const a = state.accounts.find(x => x.id === accountId);
        if (a) accountName = a.name;
      }
    }
  }

  if (editingTxId) {
    const tx = state.transactions.find(t => t.id === editingTxId);
    if (tx) {
      applyTxBalance(tx, -1);
      tx.date = date; tx.description = description; tx.type = type; tx.category = category; tx.amount = amount;
      tx.paymentType = paymentType; tx.accountId = accountId; tx.accountName = accountName;
      tx.creditCardId = creditCardId; tx.creditCardName = creditCardName;
      tx.debtId = debtId; tx.debtName = debtName;
      tx.targetAccountId = targetAccountId; tx.targetAccountName = targetAccountName;
      tx.updatedAt = Date.now();
      applyTxBalance(tx, 1);
    }
    editingTxId = null;
  } else {
    const newTx = {id:uid(), date, description, category, type, amount, paymentType, accountId, accountName, creditCardId, creditCardName, debtId, debtName, targetAccountId, targetAccountName, updatedAt: Date.now()};
    applyTxBalance(newTx, 1);
    state.transactions.push(newTx);
  }

  saveDataState(); 
  render();
}

/* Consolidated entity deletion function */
function deleteEntity(listKey, id, alertTitle, alertMsg) {
  showConfirmAlert(alertTitle, alertMsg, () => {
    if (activeEditId === id) activeEditId = null;
    if (editingTxId === id) editingTxId = null;
    const tx = state.transactions.find(t => t.id === id);
    if (listKey === 'transactions' && tx) applyTxBalance(tx, -1);
    
    if (!state.deletedIds) state.deletedIds = [];
    state.deletedIds.push(id);
    if (state.deletedIds.length > 300) state.deletedIds = state.deletedIds.slice(-300);
    state[listKey] = state[listKey].filter(x => x.id !== id);
    saveDataState();
    render();
  });
}

function renderBudget(){
  const month = state.budgetMonth, year = state.budgetYear;
  const cats = [...state.categories.income.map(c=>({c,type:"Income"})), ...state.categories.expense.map(c=>({c,type:"Expense"}))];

  let totalBudgetInc=0, totalActualInc=0, totalBudgetExp=0, totalActualExp=0;
  const rows = cats.map(({c,type})=>{
    const budgeted = state.budgets[c]||0;
    const actual = txSum(c, type, month, year);
    const diff = budgeted - actual;
    const usedPct = budgeted ? Math.min(200,(actual/budgeted*100)) : (actual>0?100:0);
    if (type==="Income"){ totalBudgetInc+=budgeted; totalActualInc+=actual; } else { totalBudgetExp+=budgeted; totalActualExp+=actual; }
    
    let dragAttrs = "";
    let handleSpan = "";
    
    if (isBudgetSortMode) {
      dragAttrs = `draggable="true" ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)" ondragenter="event.preventDefault()" ondrop="handleDrop(event)" ondragend="handleDragEnd(event)" style="transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); cursor: grab;"`;
      handleSpan = `<span style="color:var(--muted); margin-right:12px; cursor:grab; padding: 10px 0; touch-action: none; user-select: none; -webkit-user-select: none; display:inline-flex; align-items:center; opacity:0.5; transition:opacity 0.2s;" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event)" ontouchend="handleTouchEnd(event)" ontouchcancel="handleTouchEnd(event)">${ICONS.dragHandle}</span>`;
    }

    return `
    <tr data-cat="${c}" data-type="${type}" ${dragAttrs}>
      <td class="text">${handleSpan}${c}</td>
      <td class="text">${type}</td>
      <td><input type="number" value="${budgeted}" onchange="setBudget('${c}', this.value); triggerHaptic('light');" ${isBudgetSortMode ? 'disabled' : ''}></td>
      <td class="${type==='Income'?'amt-pos':'amt-neg'}">${fmt(actual)}</td>
      <td class="${diff<0 ? 'amt-neg' : 'amt-pos'}">${fmt(diff)}</td>
      <td>
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,usedPct)}%;${usedPct>100?'background:var(--brick);':''}"></div></div>
          <div class="progress-pct">${pct(usedPct)}</div>
        </div>
      </td>
    </tr>`;
  }).join("");

  const ccExpThisMonth = state.transactions.reduce((sum, t) => {
    const d = new Date(t.date + "T00:00:00");
    if (t.type === "Expense" && (t.paymentType === "Credit" || t.creditCardId) && d.getMonth() + 1 === month && d.getFullYear() === year) {
      return sum + Number(t.amount || 0);
    }
    return sum;
  }, 0);

  const ccPaidThisMonth = state.transactions.reduce((sum, t) => {
    const d = new Date(t.date + "T00:00:00");
    if (t.type === "CC Payment" && d.getMonth() + 1 === month && d.getFullYear() === year) {
      return sum + Number(t.amount || 0);
    }
    return sum;
  }, 0);

  const actualCashOutflow = totalActualExp - ccExpThisMonth + ccPaidThisMonth;
  
  const netB = totalBudgetInc - totalBudgetExp - ccPaidThisMonth;
  const netA = totalActualInc - actualCashOutflow;

  return `
  <div class="page-header">
    <div>
      <div class="page-title">Monthly Budget<span class="rule"></span></div>
      <div class="page-desc">Set a budget per category and compare it to what actually happened that month. Your credit card swipes are deferred from your cash flow until you actually pay your credit card bill!</div>
    </div>
    <div class="controls">
      <label style="font-size:12px;color:var(--muted);">Month</label>
      <select onchange="state.budgetMonth=+this.value; saveUIState(); render(); triggerHaptic('light');">
        ${monthNames.map((m,i)=>`<option value="${i+1}" ${month===i+1?'selected':''}>${m}</option>`).join("")}
      </select>
      <label style="font-size:12px;color:var(--muted);">Year</label>
      <input type="number" value="${year}" style="width:80px" onchange="state.budgetYear=+this.value; saveUIState(); render(); triggerHaptic('light');">
    </div>
  </div>
  <div class="section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <div class="section-title" style="margin-bottom:0;">${monthNames[month-1]} ${year}</div>
      <button class="btn secondary" style="padding:6px 14px;min-height:34px;display:inline-flex;align-items:center;border-radius:999px;font-weight:600;font-size:12.5px;gap:6px;" onclick="isBudgetSortMode = !isBudgetSortMode; render(); triggerHaptic('light');">${isBudgetSortMode ? ICONS.check + 'Done' : ICONS.reorder + 'Reorder'}</button>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Category</th><th>Type</th><th>Budgeted</th><th>Actual</th><th>Difference</th><th>% of Budget</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <table class="budget-totals">
      <thead><tr><th></th><th>Budgeted</th><th>Actual</th></tr></thead>
      <tbody>
        <tr><td class="text">Total Income</td><td>${fmt(totalBudgetInc)}</td><td>${fmt(totalActualInc)}</td></tr>
        <tr>
          <td class="text">
            Total Category Spending
            <button class="btn secondary" style="padding:2px 8px; min-height:24px; min-width:auto; font-size:11px; margin-left:8px; vertical-align:middle; font-weight:600;" onclick="state.showCCBreakdown = !state.showCCBreakdown; saveUIState(); render(); triggerHaptic('light');">
              ${state.showCCBreakdown ? '▾ Hide CC Flow' : '▸ Show CC Flow'}
            </button>
          </td>
          <td>${fmt(totalBudgetExp)}</td>
          <td>${fmt(totalActualExp)}</td>
        </tr>
        ${state.showCCBreakdown ? `
        <tr style="color:var(--muted);"><td class="text" style="padding-left:20px; font-weight:500; font-size:11.5px;">↳ Less: CC Swipes (Deferred Cash)</td><td style="font-weight:500; font-size:11.5px;">—</td><td class="amt-pos" style="font-weight:600; font-size:11.5px;">-${fmt(ccExpThisMonth)}</td></tr>
        <tr style="color:var(--muted);"><td class="text" style="padding-left:20px; font-weight:500; font-size:11.5px;">↳ Plus: CC Bills Paid (Cash Out)</td><td style="font-weight:500; font-size:11.5px;">—</td><td class="amt-neg" style="font-weight:600; font-size:11.5px;">+${fmt(ccPaidThisMonth)}</td></tr>
        ` : ''}
        <tr style="border-top:1px solid var(--line);"><td class="text">Actual Cash Expenses</td><td>${fmt(totalBudgetExp)}</td><td class="amt-neg">${fmt(actualCashOutflow)}</td></tr>
        <tr>
          <td class="text">
            Net Cash Flow (Income − Cash Outflow)
            <button class="btn secondary" style="padding:2px 8px; min-height:24px; min-width:auto; font-size:11px; margin-left:8px; vertical-align:middle; font-weight:600;" onclick="state.showAccountBreakdown = !state.showAccountBreakdown; saveUIState(); render(); triggerHaptic('light');">
              ${state.showAccountBreakdown ? '▾ Hide Account Balances' : '▸ Show Account Balances'}
            </button>
          </td>
          <td>${fmt(netB)}</td>
          <td class="${netA<0?'amt-neg':'amt-pos'}">${fmt(netA)}</td>
        </tr>
        ${state.showAccountBreakdown ? `
        <tr style="background:var(--card); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted);"><td colspan="3" style="padding:8px 12px; font-weight:700;">Remaining Money Left in Accounts (Live Balances)</td></tr>
        ` + (state.accounts || []).map(a => `
        <tr style="color:var(--ink);"><td class="text" style="padding-left:20px; font-weight:500; font-size:12px;">↳ <span style="display:inline-flex;align-items:center;">${a.type === 'Cash' ? ICONS.cash : ICONS.bank} ${a.name} (${a.type})</span></td><td style="font-weight:500; font-size:12px;">—</td><td class="${+a.balance >= 0 ? 'amt-pos' : 'amt-neg'}" style="font-weight:600; font-size:12px;">${fmt(a.balance)}</td></tr>
        `).join("") + `
        <tr style="border-top:1px dashed var(--line); color:var(--ink);"><td class="text" style="padding-left:20px; font-weight:700; font-size:12px;">Total Available Cash & Debit</td><td>—</td><td class="amt-pos" style="font-weight:700; font-size:12.5px;">${fmt((state.accounts || []).reduce((s,a)=>s+(+a.balance||0),0))}</td></tr>
        ` : ''}
      </tbody>
    </table>
  </div>
  `;
}

function renderSavings(){
  const ef = state.emergencyFund || { monthsTarget: 6, saved: 0, monthly: 0 };
  const avgExp = getAvgMonthlyExpense();
  const efGoal = avgExp * (ef.monthsTarget || 6);
  const efSaved = +ef.saved || 0;
  const efLeft = Math.max(0, efGoal - efSaved);
  const efProgress = efGoal ? Math.min(100, (efSaved / efGoal * 100)) : (efSaved > 0 ? 100 : 0);
  const efMonths = ef.monthly > 0 ? Math.max(0, Math.ceil(efLeft / ef.monthly)) : "—";
  let efEstDate = "—";
  if (typeof efMonths === "number" && efMonths > 0) {
    const d = new Date(); d.setMonth(d.getMonth() + efMonths);
    efEstDate = d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  } else if (efLeft <= 0 || efMonths === 0) {
    efEstDate = "Goal Reached!";
  }

  const goals = state.savingsGoals || [];
  const totalGoal = goals.reduce((s,g)=>s+(+g.goal||0), efGoal);
  const totalSaved = goals.reduce((s,g)=>s+(+g.saved||0), efSaved);
  const totalLeft = totalGoal - totalSaved;
  const totalMonthly = goals.reduce((s,g)=>s+(+g.monthly||0), (+ef.monthly||0));

  const isEfEditing = (editingSection === 'ef');

  const rows = goals.map(g=>{
    const left = (+g.goal||0)-(+g.saved||0);

/* ============================= DEBT & CREDIT CARDS & ACCOUNTS ============================= */
function renderDebt(){
  const accts = state.accounts || [];
  const totalCashBank = accts.reduce((s, a) => s + (+a.balance || 0), 0);
  const acctRows = accts.map(a => {
    if (activeEditId === a.id) {
      return `
      <tr style="background:var(--card-hover);">
        <td class="text"><input type="text" id="edit-a-name" value="${a.name}"></td>
        <td>
          <select id="edit-a-type" style="width:130px; font-weight:600;">
            <option value="Debit" ${a.type==='Debit'?'selected':''}>Debit / Bank</option>
            <option value="Cash" ${a.type==='Cash'?'selected':''}>Cash Wallet</option>
          </select>
        </td>
        <td><input type="number" id="edit-a-bal" value="${a.balance}"></td>
        ${renderSaveCancelBtns(`saveAccount('${a.id}')`)}
      </tr>`;
    }
    return `
    <tr>
      <td class="text" style="font-weight:600;">${a.name}</td>
      <td class="text"><span style="display:inline-flex;align-items:center;">${a.type === 'Cash' ? ICONS.cash : ICONS.bank} ${a.type === 'Cash' ? 'Cash' : 'Debit / Bank'}</span></td>
      <td class="${+a.balance >= 0 ? 'amt-pos' : 'amt-neg'}" style="font-weight:600;">${fmt(a.balance)}</td>
      ${renderActionBtns(a.id, `activeEditId='${a.id}'; render(); triggerHaptic('light');`, `deleteAccount('${a.id}')`)}
    </tr>`;
  }).join("");

  const ccs = state.creditCards || [];
  const totalLimit = ccs.reduce((s, c) => s + (+c.limit || 0), 0);
  const totalCCBalance = ccs.reduce((s, c) => s + (+c.balance || 0), 0);
  const totalAvailable = Math.max(0, totalLimit - totalCCBalance);
  const overallCCUtil = totalLimit ? Math.min(100, (totalCCBalance / totalLimit * 100)) : 0;

  const ccRows = ccs.map(c => {
    const limit = +c.limit || 0;
    const bal = +c.balance || 0;
    const avail = Math.max(0, limit - bal);
    const util = limit ? Math.min(100, (bal / limit * 100)) : (bal > 0 ? 100 : 0);

    if (activeEditId === c.id) {
      return `
      <tr style="background:var(--card-hover);">
        <td class="text"><input type="text" id="edit-c-name" value="${c.name}"></td>
        <td><input type="number" id="edit-c-limit" value="${c.limit}"></td>
        <td><input type="number" id="edit-c-bal" value="${c.balance}"></td>
        <td class="${avail > 0 ? 'amt-pos' : 'amt-neg'}">${fmt(avail)}</td>
        <td><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${util}%;${util > 80 ? 'background:var(--brick);' : ''}"></div></div><div class="progress-pct">${pct(util)}</div></div></td>
        ${renderSaveCancelBtns(`saveCreditCard('${c.id}')`)}
      </tr>`;
    }

    return `
    <tr>
      <td class="text" style="font-weight:600;">${c.name}</td>
      <td>${fmt(c.limit)}</td>
      <td class="amt-neg" style="font-weight:600;">${fmt(c.balance)}</td>
      <td class="${avail > 0 ? 'amt-pos' : 'amt-neg'}">${fmt(avail)}</td>
      <td>
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${util}%;${util > 80 ? 'background:var(--brick);' : ''}"></div></div>
          <div class="progress-pct">${pct(util)}</div>
        </div>
      </td>
      ${renderActionBtns(c.id, `activeEditId='${c.id}'; render(); triggerHaptic('light');`, `deleteCreditCard('${c.id}')`)}
    </tr>`;
  }).join("");

  const debts = state.debts || [];
  const totalOriginal = debts.reduce((s,d)=>s+(+d.original||0),0);
  const totalCurrent = debts.reduce((s,d)=>s+(+d.current||0),0);
  const totalPayment = debts.reduce((s,d)=>s+(+d.minPayment||0)+(+d.extraPayment||0),0);
  const paidOffPct = totalOriginal ? ((totalOriginal-totalCurrent)/totalOriginal*100) : 0;

  const rows = debts.map(d=>{
    const progress = d.original ? Math.min(100,((d.original-d.current)/d.original*100)) : 0;
    const totalPay = (+d.minPayment||0)+(+d.extraPayment||0);

    if (activeEditId === d.id) {
      return `
      <tr style="background:var(--card-hover);">
        <td class="text"><input type="text" id="edit-d-name" value="${d.name}"></td>
        <td class="text"><input type="text" id="edit-d-type" value="${d.type}"></td>
        <td><input type="number" id="edit-d-orig" value="${d.original}"></td>
        <td><input type="number" id="edit-d-curr" value="${d.current}"></td>
        <td><input type="number" id="edit-d-rate" value="${d.rate}" style="width:60px;">%</td>
        <td><input type="number" id="edit-d-min" value="${d.minPayment}"></td>
        <td><input type="number" id="edit-d-extra" value="${d.extraPayment}"></td>
        <td>${fmt(totalPay)}</td>
        <td><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div><div class="progress-pct">${pct(progress)}</div></div></td>
        ${renderSaveCancelBtns(`saveDebt('${d.id}')`)}
      </tr>`;
    }

    return `
    <tr>
      <td class="text" style="font-weight:600;">${d.name}</td>
      <td class="text">${d.type}</td>
      <td>${fmt(d.original)}</td>
      <td class="amt-neg" style="font-weight:600;">${fmt(d.current)}</td>
      <td>${d.rate}%</td>
      <td>${fmt(d.minPayment)} / mo</td>
      <td>${fmt(d.extraPayment)} / mo</td>
      <td style="font-weight:600;">${fmt(totalPay)}</td>
      <td>
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
          <div class="progress-pct">${pct(progress)}</div>
        </div>
      </td>
      ${renderActionBtns(d.id, `activeEditId='${d.id}'; render(); triggerHaptic('light');`, `deleteDebt('${d.id}')`)}
    </tr>`;
  }).join("");

  return `
  <div class="page-header">
    <div><div class="page-title">Accounts &amp; Debts<span class="rule"></span></div>
    <div class="page-desc">Manage your bank balances, cash wallets, credit card limits, and long-term loan payoffs. Tap ✎ to edit any row!</div></div>
  </div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-label">Total Cash &amp; Bank</div><div class="kpi-value amt-pos">${fmt(totalCashBank)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Credit Card Balances</div><div class="kpi-value neg">${fmt(totalCCBalance)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Available Credit</div><div class="kpi-value amt-pos">${fmt(totalAvailable)}</div></div>
    <div class="kpi-card"><div class="kpi-label">CC Utilization</div><div class="kpi-value ${overallCCUtil > 30 ? 'neg' : ''}">${pct(overallCCUtil)}</div></div>
  </div>

  <div class="section">
    <div class="section-title">
      <span class="sec-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12v12H4z"/><path d="M4 8h12"/></svg></span>
      <span>Accounts</span>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Account Name</th><th>Method Type</th><th>Current Balance</th><th></th></tr></thead>
      <tbody>${acctRows || '<tr><td colspan="4" class="empty-msg">No bank or cash accounts added yet.</td></tr>'}</tbody>
    </table>
    </div>
    <div class="add-row">
      <button class="btn" onclick="addAccount(); triggerHaptic('medium');">+ Add Account</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <span class="sec-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4.5" width="16" height="11" rx="1.5"/><line x1="2" y1="8" x2="18" y2="8"/><line x1="4.5" y1="12" x2="8.5" y2="12"/></svg></span>
      <span>Credit Cards</span>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Card Name</th><th>Credit Limit</th><th>Current Balance</th><th>Available Credit</th><th>Utilization</th><th></th></tr></thead>
      <tbody>${ccRows || '<tr><td colspan="6" class="empty-msg">No credit cards added yet. Add your card below!</td></tr>'}</tbody>
    </table>
    </div>
    <div class="add-row">
      <button class="btn" onclick="addCreditCard(); triggerHaptic('medium');">+ Add Credit Card</button>
    </div>
  </div>

  <div class="kpi-row" style="margin-top:20px;">
    <div class="kpi-card"><div class="kpi-label">Loans Original Total</div><div class="kpi-value">${fmt(totalOriginal)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Loans Current Balance</div><div class="kpi-value neg">${fmt(totalCurrent)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Monthly Payments</div><div class="kpi-value">${fmt(totalPayment)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Loans Paid Off</div><div class="kpi-value">${pct(paidOffPct)}</div></div>
  </div>

  <div class="section">
    <div class="section-title">Term Debts &amp; Loans</div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Debt</th><th>Type</th><th>Original</th><th>Current</th><th>Rate</th><th>Min. Payment</th><th>Extra</th><th>Total / mo</th><th>Paid Off</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="10" class="empty-msg">No debts logged — nice, or add one to track.</td></tr>'}</tbody>
    </table>
    </div>
    <div class="add-row">
      <button class="btn" onclick="addDebt(); triggerHaptic('medium');">+ Add Debt</button>
    </div>
  </div>
  `;
}

/* ============================= NET WORTH ============================= */
function renderNetWorth(){
  const rows = state.netWorth.map(e=>{
    const {assets, liabilities, net} = netWorthTotal(e);

    if (activeEditId === e.id) {
      return `
      <tr style="background:var(--card-hover);">
        <td class="text"><input type="text" id="edit-nw-month" value="${e.month}"></td>
        <td><input type="number" id="edit-nw-cash" value="${e.cash}"></td>
        <td><input type="number" id="edit-nw-inv" value="${e.investments}"></td>
        <td><input type="number" id="edit-nw-prop" value="${e.property}"></td>
        <td><input type="number" id="edit-nw-oth" value="${e.otherAssets}"></td>
        <td class="amt-pos">${fmt(assets)}</td>
        <td><input type="number" id="edit-nw-cc" value="${e.creditCards}"></td>
        <td><input type="number" id="edit-nw-loans" value="${e.loans}"></td>
        <td><input type="number" id="edit-nw-mort" value="${e.mortgage}"></td>
        <td><input type="number" id="edit-nw-othl" value="${e.otherLiabilities}"></td>
        <td class="amt-neg">${fmt(liabilities)}</td>
        <td class="${net<0?'amt-neg':'amt-pos'}">${fmt(net)}</td>
        ${renderSaveCancelBtns(`saveNW('${e.id}')`)}
      </tr>`;
    }

    return `
    <tr>
      <td class="text" style="font-weight:600;">${e.month}</td>
      <td>${fmt(e.cash)}</td>
      <td>${fmt(e.investments)}</td>
      <td>${fmt(e.property)}</td>
      <td>${fmt(e.otherAssets)}</td>
      <td class="amt-pos" style="font-weight:600;">${fmt(assets)}</td>
      <td class="amt-neg">${fmt(e.creditCards)}</td>
      <td class="amt-neg">${fmt(e.loans)}</td>
      <td class="amt-neg">${fmt(e.mortgage)}</td>
      <td class="amt-neg">${fmt(e.otherLiabilities)}</td>
      <td class="amt-neg" style="font-weight:600;">${fmt(liabilities)}</td>
      <td class="${net<0?'amt-neg':'amt-pos'}" style="font-weight:700;">${fmt(net)}</td>
      ${renderActionBtns(e.id, `activeEditId='${e.id}'; render(); triggerHaptic('light');`, `deleteNW('${e.id}')`)}
    </tr>`;
  }).join("");

  const points = state.netWorth.map(e=>netWorthTotal(e).net);
  const w = 640, h = 160, pad = 24;
  let chartSvg = "";
  if (points.length>1){
    const min = Math.min(...points,0), max = Math.max(...points,1);
    const range = (max-min)||1;
    const stepX = (w-pad*2)/(points.length-1);
    const coords = points.map((v,i)=>[pad+i*stepX, h-pad-((v-min)/range)*(h-pad*2)]);
    const path = coords.map((c,i)=> (i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
    const dots = coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="var(--gold)"/>`).join("");
    chartSvg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;">
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/>
      <path d="${path}" fill="none" stroke="var(--ledger)" stroke-width="2.5"/>
      ${dots}
    </svg>`;
  } else {
    chartSvg = `<div class="empty-msg">Add at least two monthly entries to see a trend line.</div>`;
  }

  return `
  <div class="page-header">
    <div><div class="page-title">Net Worth Tracker<span class="rule"></span></div>
    <div class="page-desc">Log your assets and liabilities each month to watch your net worth trend over time. Tap ✎ to safely edit entries!</div></div>
  </div>
  <div class="section">
    <div class="section-title">Trend</div>
    <div class="line-chart-wrap" style="padding-bottom:10px;">${chartSvg}</div>
  </div>
  <div class="section">
    <div class="section-title">Monthly Entries</div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Month</th><th>Cash</th><th>Investments</th><th>Property</th><th>Other</th><th>Total Assets</th><th>Credit Cards</th><th>Loans</th><th>Mortgage</th><th>Other</th><th>Total Liab.</th><th>Net Worth</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="13" class="empty-msg">No entries yet.</td></tr>'}</tbody>
    </table>
    </div>
    <div class="add-row"><button class="btn" onclick="addNW(); triggerHaptic('medium');">+ Add Month</button></div>
  </div>
  `;
}
function saveNW(id) {
  const e = state.netWorth.find(x=>x.id===id); if(!e) return;
  e.month = document.getElementById("edit-nw-month") ? document.getElementById("edit-nw-month").value : e.month;
  e.cash = parseFloat(document.getElementById("edit-nw-cash").value) || 0;
  e.investments = parseFloat(document.getElementById("edit-nw-inv").value) || 0;
  e.property = parseFloat(document.getElementById("edit-nw-prop").value) || 0;
  e.otherAssets = parseFloat(document.getElementById("edit-nw-oth").value) || 0;
  e.creditCards = parseFloat(document.getElementById("edit-nw-cc").value) || 0;
  e.loans = parseFloat(document.getElementById("edit-nw-loans").value) || 0;
  e.mortgage = parseFloat(document.getElementById("edit-nw-mort").value) || 0;
  e.otherLiabilities = parseFloat(document.getElementById("edit-nw-othl").value) || 0;
  e.updatedAt = Date.now();
  activeEditId = null;
  saveDataState(); render();
}
function addNW(){
  const newId = uid();
  state.netWorth.push({id:newId, month:"New Month", cash:0, investments:0, property:0, otherAssets:0, creditCards:0, loans:0, mortgage:0, otherLiabilities:0, updatedAt: Date.now()});
  activeEditId = newId;
  saveDataState(); render();
}

/* ============================= CATEGORIES ============================= */
function renderCategories(){
  const isIncEditing = (editingSection === 'inc');
  const isExpEditing = (editingSection === 'exp');

  const incomeTags = state.categories.income.map(c=>`
    <div class="tag">${c}${isIncEditing ? `<button onclick="removeCategory('income','${c}')" title="Delete" style="display:inline-flex;align-items:center;">${ICONS.close}</button>` : ''}</div>`).join("");
  const expenseTags = state.categories.expense.map(c=>`
    <div class="tag">${c}${isExpEditing ? `<button onclick="removeCategory('expense','${c}')" title="Delete" style="display:inline-flex;align-items:center;">${ICONS.close}</button>` : ''}</div>`).join("");

  return `
  <div class="page-header">
    <div><div class="page-title">Categories<span class="rule"></span></div>
    <div class="page-desc">Edit these lists to customize every dropdown across the tracker. Tap Edit to add or remove categories!</div></div>
    <div class="controls">
      <label style="font-size:12px;color:var(--muted);">Currency symbol</label>
      <input type="text" value="${state.currency}" style="width:50px" onchange="state.currency=this.value||'$'; saveDataState(); render(); triggerHaptic('light');">
    </div>
  </div>
  <div class="two-col">
    <div class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <div class="section-title" style="margin-bottom:0;">Income Categories</div>
        <button class="btn secondary" style="padding:4px 10px;min-height:32px;display:inline-flex;align-items:center;" onclick="editingSection = (editingSection === 'inc') ? null : 'inc'; render(); triggerHaptic('light');">${isIncEditing ? 'Done' : `${ICONS.edit} Edit`}</button>
      </div>
      <div class="tag-list">${incomeTags || '<span class="empty-msg">None yet.</span>'}</div>
      ${isIncEditing ? `
      <div class="add-row">
        <input type="text" id="new-income-cat" class="desc" placeholder="New income category">
        <button class="btn secondary" onclick="addCategory('income'); triggerHaptic('medium');">+ Add</button>
      </div>` : ''}
    </div>
    <div class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <div class="section-title" style="margin-bottom:0;">Expense Categories</div>
        <button class="btn secondary" style="padding:4px 10px;min-height:32px;display:inline-flex;align-items:center;" onclick="editingSection = (editingSection === 'exp') ? null : 'exp'; render(); triggerHaptic('light');">${isExpEditing ? 'Done' : `${ICONS.edit} Edit`}</button>
      </div>
      <div class="tag-list">${expenseTags || '<span class="empty-msg">None yet.</span>'}</div>
      ${isExpEditing ? `
      <div class="add-row">
        <input type="text" id="new-expense-cat" class="desc" placeholder="New expense category">
        <button class="btn secondary" onclick="addCategory('expense'); triggerHaptic('medium');">+ Add</button>
      </div>` : ''}
    </div>
  </div>
  <div class="small-note">Removing a category doesn't delete past transactions logged under it — it just stops appearing in the dropdowns.</div>
  `;
}
function addCategory(kind){
  const input = document.getElementById(kind==="income"?"new-income-cat":"new-expense-cat");
  const val = input ? input.value.trim() : "";
  if (!val) return;
  if (!state.categories[kind].includes(val)) state.categories[kind].push(val);
  saveDataState(); render();
}
function removeCategory(kind, name){
  showConfirmAlert("Remove Category", `Remove "${name}" from your ${kind} categories?`, () => {
    state.categories[kind] = state.categories[kind].filter(c=>c!==name);
    saveDataState(); render();
  });
}

/* ============================= INIT & SCROLL MINIMIZATION ============================= */
window.addEventListener("beforeunload", () => { clearTimeout(saveTimer); commitSave(false, false); });
window.addEventListener("resize", () => {
  const mobileNav = document.getElementById("mobile-nav");
  if (mobileNav) updateTabIndicator(mobileNav, state.activeTab, false);
});

let lastScrollY = window.scrollY || 0;
let scrollDelta = 0;
let isTabMinimized = false;
let isHeaderMinimized = false;

window.addEventListener("scroll", (e) => {
  const sidebar = document.getElementById('sidebar');
  if (sidebar && !sidebar.classList.contains('collapsed') && window.innerWidth > 760) {
    if (e.target === sidebar || sidebar.contains(e.target)) return;
    sidebar.style.width = '';
    sidebar.style.transition = '';
    sidebar.classList.add('collapsed');
    localStorage.setItem('sidebar_collapsed', true);
  }

  if (window.innerWidth <= 760) {
    const currentScrollY = window.scrollY || 0;
    const diff = currentScrollY - lastScrollY;
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    const isAtBottom = currentScrollY >= (maxScroll - 15);
    
    if (Math.abs(diff) > 2) {
      if (diff > 0 && currentScrollY > 60) {
        scrollDelta += diff;
        if (scrollDelta > 30 && (!isTabMinimized || !isHeaderMinimized)) {
          isTabMinimized = true;
          isHeaderMinimized = true;
          const nav = document.getElementById("mobile-nav");
          const header = document.querySelector(".mobile-header");
          if (nav) nav.classList.add("minimized");
          if (header) header.classList.add("minimized");
          triggerHaptic('light');
        }
      } else if (diff < -6 && !isAtBottom) {
        scrollDelta = 0;
        if (isTabMinimized) {
          isTabMinimized = false;
          const nav = document.getElementById("mobile-nav");
          if (nav) {
            nav.classList.remove("minimized");
            updateTabIndicator(nav, state.activeTab, true);
            triggerHaptic('light');
          }
        }
      }
      lastScrollY = currentScrollY;
    }

    if (currentScrollY <= 15 && (isHeaderMinimized || isTabMinimized)) {
      if (isHeaderMinimized) {
        isHeaderMinimized = false;
        const header = document.querySelector(".mobile-header");
        if (header) {
          header.classList.remove("minimized");
          triggerHaptic('light');
        }
      }
      if (isTabMinimized) {
        isTabMinimized = false;
        const nav = document.getElementById("mobile-nav");
        if (nav) {
          nav.classList.remove("minimized");
          updateTabIndicator(nav, state.activeTab, true);
        }
      }
    }
  }
}, { passive: true, capture: true });

document.addEventListener("click", (e) => {
  const sidebar = document.getElementById('sidebar');
  if (sidebar && !sidebar.classList.contains('collapsed') && window.innerWidth > 760) {
    if (!sidebar.contains(e.target)) {
      sidebar.style.width = '';
      sidebar.style.transition = '';
      sidebar.classList.add('collapsed');
      localStorage.setItem('sidebar_collapsed', true);
    }
  }
});

/* ============================= DRAG & DROP REORDERING ============================= */
let draggedRow = null;
let touchDraggedRow = null;

function handleDragStart(e) {
  if (!isBudgetSortMode) return;
  draggedRow = e.currentTarget;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => { 
    if (draggedRow) {
      draggedRow.style.opacity = '0.9'; 
      draggedRow.style.transform = 'scale(1.01)';
      draggedRow.style.boxShadow = '0 12px 32px rgba(0,0,0,0.15)';
      draggedRow.style.backgroundColor = 'var(--card-hover)';
    }
  }, 0);
  triggerHaptic('light');
}

function handleDragOver(e) {
  if (!isBudgetSortMode) return;
  e.preventDefault(); 
  e.dataTransfer.dropEffect = 'move';
  const targetRow = e.target.closest('tr[data-cat]');
  if (!targetRow || targetRow === draggedRow) return;
  if (draggedRow.dataset.type !== targetRow.dataset.type) return;

  const rect = targetRow.getBoundingClientRect();
  const offset = e.clientY - rect.top;
  if (offset > rect.height / 2) {
    targetRow.parentNode.insertBefore(draggedRow, targetRow.nextSibling);
  } else {
    targetRow.parentNode.insertBefore(draggedRow, targetRow);
  }
}

function handleDrop(e) {
  if (!isBudgetSortMode) return;
  e.preventDefault();
}

function handleDragEnd(e) {
  if (!draggedRow) return;
  draggedRow.style.opacity = '';
  draggedRow.style.transform = '';
  draggedRow.style.boxShadow = '';
  draggedRow.style.backgroundColor = '';
  finalizeRowOrder(draggedRow.parentNode);
  draggedRow = null;
}

function handleTouchStart(e) {
  if (!isBudgetSortMode) return;
  touchDraggedRow = e.target.closest('tr[data-cat]');
  if (!touchDraggedRow) return;
  touchDraggedRow.style.opacity = '0.9';
  touchDraggedRow.style.transform = 'scale(1.02)';
  touchDraggedRow.style.boxShadow = '0 16px 40px rgba(0,0,0,0.2)';
  touchDraggedRow.style.backgroundColor = 'var(--card-hover)';
  touchDraggedRow.style.position = 'relative';
  touchDraggedRow.style.zIndex = '100';
  triggerHaptic('light');
}

function handleTouchMove(e) {
  if (!touchDraggedRow || !isBudgetSortMode) return;
  e.preventDefault();
  
  const touch = e.touches[0];
  const elem = document.elementFromPoint(touch.clientX, touch.clientY);
  if (!elem) return;
  
  const targetRow = elem.closest('tr[data-cat]');
  if (!targetRow || targetRow === touchDraggedRow) return;
  if (touchDraggedRow.dataset.type !== targetRow.dataset.type) return;

  const rect = targetRow.getBoundingClientRect();
  const offset = touch.clientY - rect.top;
  
  if (offset > rect.height / 2) {
    targetRow.parentNode.insertBefore(touchDraggedRow, targetRow.nextSibling);
  } else {
    targetRow.parentNode.insertBefore(touchDraggedRow, targetRow);
  }
}

function handleTouchEnd(e) {
  if (!touchDraggedRow || !isBudgetSortMode) return;
  touchDraggedRow.style.opacity = '';
  touchDraggedRow.style.transform = '';
  touchDraggedRow.style.boxShadow = '';
  touchDraggedRow.style.backgroundColor = '';
  touchDraggedRow.style.position = '';
  touchDraggedRow.style.zIndex = '';
  finalizeRowOrder(touchDraggedRow.parentNode);
  touchDraggedRow = null;
}

function finalizeRowOrder(tbody) {
  const allRows = Array.from(tbody.querySelectorAll('tr[data-cat]'));
  state.categories.income = [];
  state.categories.expense = [];
  allRows.forEach(row => {
    const cat = row.dataset.cat;
    const type = row.dataset.type;
    if (type === "Income") state.categories.income.push(cat);
    if (type === "Expense") state.categories.expense.push(cat);
  });
  saveDataState();
  render();
  triggerHaptic('medium');
}

if (window.Capacitor && window.Capacitor.Plugins) {
  try {
    const { StatusBar, SplashScreen } = window.Capacitor.Plugins;
    if (StatusBar) StatusBar.setStyle({ style: 'DARK' });
    if (SplashScreen) SplashScreen.hide();
  } catch(e) {}
}

loadState();
</script>
</body>
</html>
